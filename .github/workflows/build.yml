name: build-docker-image

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    # Gitea Actions also reads .github/workflows — this job is GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build:
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/atvriders/hamdoor:latest
            ghcr.io/atvriders/hamdoor:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Atvriders/hamdoor
