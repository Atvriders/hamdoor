<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151d45" media="(prefers-color-scheme: dark)">
  <meta name="description" content="hamdoor: a neighbourhood network for amateur radio operators.">
  <title>hamdoor</title>
  <link rel="preload" href="/static/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/map.css">
</head>
<body class="hd-app">
  <a class="hd-skip" href="#hd-main" data-skip>Skip to content</a>

  <!-- Desktop rail (1024 px and up). hd-chrome.js fills it. -->
  <nav class="hd-rail" aria-label="Main" data-nav-rail></nav>

  <main id="hd-main" class="hd-main" tabindex="-1">
    <section data-view="auth" class="hd-view hd-view--auth" hidden></section>
    <section data-view="map" class="hd-view hd-view--map" hidden>
      <div id="hd-map" class="hd-map" tabindex="0" aria-label="Map"></div>
      <div id="hd-map-ui"></div>
    </section>
    <section data-view="feed" class="hd-view hd-view--list" hidden></section>
    <section data-view="nearby" class="hd-view hd-view--list" hidden></section>
    <section data-view="activity" class="hd-view hd-view--list" hidden></section>
    <section data-view="you" class="hd-view hd-view--list" hidden></section>
  </main>

  <!-- Phone tab bar; in the short (landscape) layout the same element is the left rail. -->
  <nav class="hd-tabbar" aria-label="Main" data-tuck="bottom" data-nav-tabs></nav>

  <!-- Keeps the phone clock readable over the map and above tucked bars (viewport-fit=cover). -->
  <div class="hd-statusscrim" aria-hidden="true"></div>

  <!-- One polite live region for toasts, one for quiet announcements (DESIGN_SYSTEM §7.7). -->
  <div id="hd-toasts" class="hd-toasts" role="status" aria-live="polite"></div>
  <div id="hd-announce" class="hd-sr" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/js/hd-core.js"></script>
  <script src="/static/js/hd-icons.js"></script>
  <script src="/static/js/hd-chrome.js"></script>
  <script src="/static/js/map/map-core.js"></script>
  <script src="/static/js/map/map-marks.js"></script>
  <script src="/static/js/map/map-ui.js"></script>
  <script src="/static/js/map/layer-fcc.js"></script>
  <script src="/static/js/map/layer-people.js"></script>
  <script src="/static/js/map/layer-repeaters.js"></script>
  <script src="/static/js/map/layer-aprs.js"></script>
  <script src="/static/js/map/layer-spots.js"></script>
  <script src="/static/js/map/layer-posts.js"></script>
  <script src="/static/js/views/auth.js"></script>
  <script src="/static/js/views/feed.js"></script>
  <script src="/static/js/views/nearby.js"></script>
  <script src="/static/js/views/activity.js"></script>
  <script src="/static/js/views/you.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
